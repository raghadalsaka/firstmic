name: CI

# On a push to main the deploy workflow runs this first, then builds and publishes the image.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      # On a push the deploy workflow builds and publishes the same commit right after this job.
      - if: ${{ github.event_name != 'push' }}
        run: docker build -t firstmic:ci .
