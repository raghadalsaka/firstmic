name: Publish and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Redeploy or roll back an already published commit (full 40-character SHA). Leave empty to build, publish and deploy the current commit."
        required: false
        default: ""

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/firstmic

jobs:
  ci:
    name: CI
    if: ${{ github.event.inputs.sha == '' }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish image to GHCR
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Baked into the web app at build time; a missing value would ship an app where teachers can't sign in.
      - name: Check the Google client ID variable
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          [ -n "$VITE_GOOGLE_CLIENT_ID" ] || { echo "Set the repository variable VITE_GOOGLE_CLIENT_ID (docs/DEPLOYMENT.md)" >&2; exit 1; }

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=firstmic
            org.opencontainers.image.description=First Mic podcast app for Grade 6

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    needs: publish
    # After a successful publish, or directly for a manual redeploy/rollback of an already published SHA
    # (ci and publish are skipped then; the server-side docker pull fails clearly if the tag does not exist).
    if: ${{ !cancelled() && (github.event.inputs.sha != '' || needs.publish.result == 'success') }}
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: deploy-firstmic
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      SHA: ${{ github.event.inputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate inputs
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full 40-character commit SHA" >&2; exit 1; }
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]

      - name: Configure SSH
        uses: ./.github/actions/droplet-ssh
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          user: ${{ secrets.DEPLOY_USER }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          host-key: ${{ secrets.DEPLOY_HOST_KEY }}

      - name: Check the SSH connection
        run: |
          ssh -n droplet 'echo "connected as $(id -un) on $(hostname)"; mkdir -p /opt/firstmic/bin || { echo "cannot create /opt/firstmic/bin: /opt/firstmic must exist and be owned by the deploy user (see docs/DEPLOYMENT.md)" >&2; exit 1; }'

      # The compose file is staged under the run id; the script validates it, moves it to
      # compose.yml atomically and removes the staged copy on exit (success or failure).
      - name: Copy deployment files to the server
        run: |
          scp deploy/compose.production.yml "droplet:/opt/firstmic/.compose.yml.$GITHUB_RUN_ID"
          scp deploy/scripts/deploy.sh droplet:/opt/firstmic/bin/deploy.sh

      - name: Deploy
        run: ssh -n droplet "chmod 700 /opt/firstmic/bin/deploy.sh && /opt/firstmic/bin/deploy.sh $SHA $GITHUB_RUN_ID"

      - name: Remove the staged compose file if the script never ran
        if: ${{ failure() }}
        run: ssh -n droplet "rm -f /opt/firstmic/.compose.yml.$GITHUB_RUN_ID" || true

      - name: Remove SSH material
        if: ${{ always() }}
        run: rm -rf ~/.ssh
